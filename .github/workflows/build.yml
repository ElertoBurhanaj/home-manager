name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HomeManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HomeManager-apk
          path: HomeManager.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Home Manager (build ${{ github.run_number }})
          body: |
            APK installabile per Android 8.0 o superiore.
            Scarica `HomeManager.apk`, aprilo sul telefono e consenti l'installazione da questa fonte.
          files: HomeManager.apk
          make_latest: true

      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/cilog
          tail -n 400 build.log > /tmp/cilog/log.txt || echo "no log" > /tmp/cilog/log.txt
          cd /tmp/cilog
          git init -q -b ci-log
          git config user.email ci@example.com
          git config user.name ci
          git add log.txt
          git commit -q -m "build log"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-log
